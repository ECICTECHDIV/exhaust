                load: "載入",
                delete: "刪除",
                clearAllSaved: "清除所有保存的染程",
                calculationMethods: "計算方法",
                washType: "水洗類型",
                neutralization: "中和",
                rinse: "水洗",
                soaping: "皂洗",
                softening: "柔軟",
                fixing: "固色",
                addWash: "添加水洗",
                removeWash: "移除",
                showLabels: "顯示標籤",
                hideLabels: "隱藏標籤",
                dyeingStageTemp: "階段 {0} 溫度 (°C)",
                dyeingStageTime: "階段 {0} 時間 (分鐘)",
                showTemperatureLabels: "顯示溫度",
                hideTemperatureLabels: "隱藏溫度",
                showDurationLabels: "顯示時間",
                hideDurationLabels: "隱藏時間",
                lineColor: "線條顏色",
                textColor: "文字顏色",
                basicSettings: "基礎設置",
                dyeingStageSettings: "染色階段設置",
                washingStageSettings: "水洗階段設置",
                visualControls: "視覺化控制",
                totalConsumption: "總消耗量",
                unitFabricConsumption: "單位布耗量",
                washingSettings: "水洗設置"
            }
        };

        const InputField = ({ label, value, onChange, type = "number", error, min, max, style, tooltip }) => {
            const { language } = useLanguage();
            const text = translations[language];
            return (
                <div style={style}>
                    <label className="tooltip">
                        {text[label] || label}
                        {tooltip && <span className="tooltiptext">{text[tooltip]}</span>}
                    </label>
                    <input
                        type={type}
                        value={value}
                        onChange={(e) => {
                            const newValue = type === "number" ? Number(e.target.value) : e.target.value;
                            if ((min === undefined || newValue >= min) && (max === undefined || newValue <= max)) {
                                onChange(newValue);
                            }
                        }}
                        min={min}
                        max={max}
                    />
                    {error && <div className="error">{error}</div>}
                </div>
            );
        };

        const SelectField = ({ label, value, onChange, options }) => {
            const { language } = useLanguage();
            const text = translations[language];
            return (
                <div>
                    <label>{text[label] || label}</label>
                    <select value={value} onChange={(e) => onChange(e.target.value)}>
                        {options.map((option) => (
                            <option key={option.value} value={option.value}>
                                {text[option.label] || option.label}
                            </option>
                        ))}
                    </select>
                </div>
            );
        };

        const ProcessForm = ({ process, onUpdate, onDelete, onSave }) => {
            const [isExpanded, setIsExpanded] = useState(true);
            const { language } = useLanguage();
            const text = translations[language];

            const handleChange = (field, value) => {
                onUpdate({ ...process, [field]: value });
            };

            const handleDyeingStageChange = (stageIndex, field, value) => {
                const newStages = [...process.dyeingStages];
                newStages[stageIndex] = { ...newStages[stageIndex], [field]: value };
                onUpdate({ ...process, dyeingStages: newStages });
            };

            const handleWashChange = (index, field, value) => {
                const newArray = [...process[field]];
                newArray[index] = value;
                onUpdate({ ...process, [field]: newArray });
            };

            const addWash = () => {
                onUpdate({
                    ...process,
                    washSteps: process.washSteps + 1,
                    washTemps: [...process.washTemps, 60],
                    washTimes: [...process.washTimes, 10],
                    washTypes: [...process.washTypes, 'rinse']
                });
            };

            const removeWash = (index) => {
                onUpdate({
                    ...process,
                    washSteps: process.washSteps - 1,
                    washTemps: process.washTemps.filter((_, i) => i !== index),
                    washTimes: process.washTimes.filter((_, i) => i !== index),
                    washTypes: process.washTypes.filter((_, i) => i !== index)
                });
            };

            const shouldShowCoolingRate = (index) => {
                if (process.dyeingMode === 'oneStage') return false;
                if (index === 0) return false;
                return true;
            };

            return (
                <div className="process-form">
                    <button className="collapsible" onClick={() => setIsExpanded(!isExpanded)}>
                        <span>{process.name}</span>
                        <span>{isExpanded ? '▲' : '▼'}</span>
                    </button>
                    <div className={`content ${isExpanded ? 'expanded' : ''}`}>
                        <InputField 
                            label="processName" 
                            value={process.name} 
                            onChange={(value) => handleChange('name', value)} 
                            type="text"
                            style={{ marginBottom: '20px' }}
                        />
                        
                        <div className="process-section">
                            <div className="section-title">{text.basicSettings}</div>
                            <div className="input-group">
                                <InputField label="fabricWeight" value={process.fabricWeight} onChange={(value) => handleChange('fabricWeight', value)} min={0} />
                                <InputField label="liquorRatio" value={process.bathRatio} onChange={(value) => handleChange('bathRatio', value)} min={1} />
                                <InputField label="initialTemp" value={process.initialTemp} onChange={(value) => handleChange('initialTemp', value)} min={0} max={140} />
                            </div>
                            <div className="input-group">
                                <InputField label="machinePower" value={process.machinePower} onChange={(value) => handleChange('machinePower', value)} min={0} />
                                <SelectField 
                                    label="heatSource" 
                                    value={process.heatSource} 
                                    onChange={(value) => handleChange('heatSource', value)}
                                    options={[
                                        { value: 'coal', label: 'coal' },
                                        { value: 'heavyOil', label: 'heavyOil' },
                                        { value: 'naturalGas', label: 'naturalGas' }
                                    ]}
                                />
                                <SelectField 
                                    label="dyeingMode" 
                                    value={process.dyeingMode} 
                                    onChange={(value) => {
                                        let newStages;
                                        switch(value) {
                                            case 'oneStage':
                                                newStages = [{ temp: 60, time: 60, heatingRate: 2, coolingRate: 1 }];
                                                break;
                                            case 'twoStageSameBath':
                                                newStages = [
                                                    { temp: 60, time: 30, heatingRate: 2, coolingRate: 1 }, 
                                                    { temp: 80, time: 30, heatingRate: 2, coolingRate: 1 }
                                                ];
                                                break;
                                            case 'twoStageTwoBaths':
                                                newStages = [
                                                    { temp: 60, time: 30, heatingRate: 2, coolingRate: 1 }, 
                                                    { temp: 80, time: 30, heatingRate: 2, coolingRate: 1 }
                                                ];
                                                break;
                                            case 'threeStageSameBath':
                                                newStages = [
                                                    { temp: 60, time: 20, heatingRate: 2, coolingRate: 1 }, 
                                                    { temp: 80, time: 20, heatingRate: 2, coolingRate: 1 },
                                                    { temp: 100, time: 20, heatingRate: 2, coolingRate: 1 }
                                                ];
                                                break;
                                            default:
                                                newStages = [{ temp: 60, time: 60, heatingRate: 2, coolingRate: 1 }];
                                        }
                                        onUpdate({ ...process, dyeingMode: value, dyeingStages: newStages });
                                    }}
                                    options={[
                                        { value: 'oneStage', label: 'oneStage' },
                                        { value: 'twoStageSameBath', label: 'twoStageSameBath' },
                                        { value: 'twoStageTwoBaths', label: 'twoStageTwoBaths' },
                                        { value: 'threeStageSameBath', label: 'threeStageSameBath' },
                                    ]}
                                />
                            </div>
                        </div>
                        
                        <div className="process-section">
                            <div className="section-title">{text.dyeingStageSettings}</div>
                            {process.dyeingStages.map((stage, index) => (
                                <div key={index} className="stage-row">
                                    <InputField 
                                        label={text.dyeingStageTemp.replace("{0}", index + 1)}
                                        value={stage.temp} 
                                        onChange={(value) => handleDyeingStageChange(index, 'temp', value)} 
                                        min={0} 
                                        max={140}
                                    />
                                    <InputField 
                                        label={text.dyeingStageTime.replace("{0}", index + 1)}
                                        value={stage.time} 
                                        onChange={(value) => handleDyeingStageChange(index, 'time', value)} 
                                        min={0}
                                    />
                                    <InputField 
                                        label="heatingRate"
                                        value={stage.heatingRate} 
                                        onChange={(value) => handleDyeingStageChange(index, 'heatingRate', value)} 
                                        min={0}
                                    />
                                    {shouldShowCoolingRate(index) && (
                                        <InputField 
                                            label="coolingRate"
                                            value={stage.coolingRate} 
                                            onChange={(value) => handleDyeingStageChange(index, 'coolingRate', value)} 
                                            min={0}
                                        />
                                    )}
                                </div>
                            ))}
                        </div>
                        
                        <div className="process-section">
                            <div className="section-title">{text.washingStageSettings}</div>
                            <div style={{marginBottom: '20px'}}>
                                <InputField
                                    label="washingHeatingRate"
                                    value={process.washHeatingRate}
                                    onChange={(value) => handleChange('washHeatingRate', value)}
                                    min={0}
                                />
                            </div>
                            {Array.from({ length: process.washSteps }).map((_, index) => (
                                <div key={index} className="wash-line">
                                    <InputField
                                        label={`${text.wash} ${index + 1} ${text.temp} (°C)`}
                                        value={process.washTemps[index]}
                                        onChange={(value) => handleWashChange(index, 'washTemps', value)}
                                        min={0}
                                        max={140}
                                    />
                                    <InputField
                                        label={`${text.wash} ${index + 1} ${text.time} (${text.min})`}
                                        value={process.washTimes[index]}
                                        onChange={(value) => handleWashChange(index, 'washTimes', value)}
                                        min={0}
                                    />
                                    <SelectField
                                        label={`${text.wash} ${index + 1} ${text.washType}`}
                                        value={process.washTypes[index]}
                                        onChange={(value) => handleWashChange(index, 'washTypes', value)}
                                        options={[
                                            { value: 'neutralization', label: 'neutralization' },
                                            { value: 'rinse', label: 'rinse' },
                                            { value: 'soaping', label: 'soaping' },
                                            { value: 'softening', label: 'softening' },
                                            { value: 'fixing', label: 'fixing' },
                                        ]}
                                    />
                                    <button className="unified-button" onClick={() => removeWash(index)}>
                                        {text.removeWash}
                                    </button>
                                </div>
                            ))}
                            <button className="unified-button" onClick={addWash} style={{width: '100%'}}>
                                {text.addWash}
                            </button>
                        </div>
                        
                        <div className="action-buttons">
                            <button className="save-process" onClick={() => onSave(process)}>
                                {text.saveProcess}
                            </button>
                            <button className="delete-process" onClick={onDelete}>
                                {text.deleteProcess}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const CustomSettings = ({ settings, onUpdateSettings }) => {
            const [localSettings, setLocalSettings] = useState(settings);
            const [isExpanded, setIsExpanded] = useState(false);
            const { language } = useLanguage();
            const text = translations[language];

            const handleChange = (field, value) => {
                setLocalSettings({ ...localSettings, [field]: value });
            };

            const handleSave = () => {
                onUpdateSettings(localSettings);
                alert(text.saved);
            };

            const handleReset = () => {
                const defaultSettings = {
                    waterHeatCapacity: 4.186,
                    boilerEfficiency: 0.8,
                    steamLatentHeat: 2257,
                    electricityEmissionFactor: 0.5,
                    waterInOutTime: 5,
                    temperatureMaintainFactor: 0.005,
                    heatLossFactor: 0.1,
                    residualWaterFactor: 2
                };
                setLocalSettings(defaultSettings);
                onUpdateSettings(defaultSettings);
            };

            return (
                <div className="custom-settings">
                    <button className="collapsible" onClick={() => setIsExpanded(!isExpanded)}>
                        <span>{text.customSettings}</span>
                        <span>{isExpanded ? '▲' : '▼'}</span>
                    </button>
                    <div className={`content ${isExpanded ? 'expanded' : ''}`}>
                        <div className="input-group">
                            <InputField 
                                label="waterHeatCapacity"
                                value={localSettings.waterHeatCapacity} 
                                onChange={(value) => handleChange('waterHeatCapacity', value)} 
                                min={0}
                            />
                            <InputField 
                                label="boilerEfficiency"
                                value={localSettings.boilerEfficiency} 
                                onChange={(value) => handleChange('boilerEfficiency', value)} 
                                min={0}
                                max={1}
                            />
                        </div>
                        <div className="input-group">
                            <InputField 
                                label="steamLatentHeat"
                                value={localSettings.steamLatentHeat} 
                                onChange={(value) => handleChange('steamLatentHeat', value)} 
                                min={0}
                            />
                            <InputField 
                                label="electricityEmission"
                                value={localSettings.electricityEmissionFactor} 
                                onChange={(value) => handleChange('electricityEmissionFactor', value)} 
                                min={0}
                            />
                        </div>
                        <div className="input-group">
                            <InputField 
                                label="waterInOutTime"
                                value={localSettings.waterInOutTime} 
                                onChange={(value) => handleChange('waterInOutTime', value)} 
                                min={0}
                            />
                            <InputField 
                                label="tempMaintainFactor"
                                value={localSettings.temperatureMaintainFactor} 
                                onChange={(value) => handleChange('temperatureMaintainFactor', value)} 
                                min={0}
                            />
                        </div>
                        <div className="input-group">
                            <InputField 
                                label="heatLossFactor"
                                value={localSettings.heatLossFactor} 
                                onChange={(value) => handleChange('heatLossFactor', value)} 
                                min={0}
                                max={1}
                            />
                            <InputField 
                                label="residualWaterFactor"
                                value={localSettings.residualWaterFactor} 
                                onChange={(value) => handleChange('residualWaterFactor', value)} 
                                min={0}
                            />
                        </div>
                        <div className="action-buttons">
                            <button className="save-process" onClick={handleSave}>{text.saveSettings}</button>
                            <button className="unified-button" onClick={handleReset}>{text.resetDefaults}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const calculateEmissions = (process, settings) => {
            const calculateTotalWaterAmount = (process) => {
                const { fabricWeight, bathRatio, washSteps, dyeingMode } = process;
                const { residualWaterFactor } = settings;
                
                const dyeingWaterAmount = fabricWeight * bathRatio;
                const residualWater = fabricWeight * residualWaterFactor;
                let totalWaterAmount = dyeingWaterAmount;

                const waterTopUpPerWash = Math.max(0, dyeingWaterAmount - residualWater);
                totalWaterAmount += waterTopUpPerWash * washSteps;
                
                if (dyeingMode === 'twoStageTwoBaths') {
                    totalWaterAmount += Math.max(0, dyeingWaterAmount - residualWater);
                }
                
                return totalWaterAmount;
            };

            const totalWaterAmount = calculateTotalWaterAmount(process);
            const waterAmountForEnergyCalc = process.fabricWeight * process.bathRatio;

            const calculateHeatEnergy = (waterAmount, initialTemp, targetTemp, processTime) => {
                const heatingEnergy = waterAmount * settings.waterHeatCapacity * (targetTemp - initialTemp);
                const maintainEnergy = waterAmount * settings.waterHeatCapacity * settings.temperatureMaintainFactor * processTime;
                return heatingEnergy + maintainEnergy;
            };

            let dyeingEnergy = 0;
            let dyeingTime = 0;
            
            process.dyeingStages.forEach((stage, index) => {
                const initialTemp = (process.dyeingMode === 'twoStageTwoBaths' && index === 1) ? process.initialTemp : 
                                    (index === 0 ? process.initialTemp : process.dyeingStages[index - 1].temp);
                
                let tempChangeTime = 0;
                if (stage.temp > initialTemp) {
                    tempChangeTime = (stage.temp - initialTemp) / stage.heatingRate;
                } else if (stage.temp < initialTemp) {
                    if (index > 0 && process.dyeingMode !== 'oneStage') {
                        tempChangeTime = (initialTemp - stage.temp) / stage.coolingRate;
                    } else {
                        tempChangeTime = (initialTemp - stage.temp) / stage.heatingRate;
                    }
                }
                
                dyeingEnergy += calculateHeatEnergy(waterAmountForEnergyCalc, initialTemp, stage.temp, stage.time);
                dyeingTime += stage.time + tempChangeTime;
            });
            
            if (process.dyeingMode === 'twoStageTwoBaths') {
                dyeingTime += settings.waterInOutTime;
            }

            const washingEnergy = process.washTemps.reduce((total, temp, index) => {
                return total + calculateHeatEnergy(waterAmountForEnergyCalc, process.initialTemp, temp, process.washTimes[index]);
            }, 0);

            const totalThermalEnergy = (dyeingEnergy + washingEnergy) / (1 - settings.heatLossFactor) / 3600;

            const washingTime = process.washTemps.reduce((total, temp, index) => {
                const heatingTime = (temp > process.initialTemp) ? 
                    (temp - process.initialTemp) / process.washHeatingRate : 0;
                return total + process.washTimes[index] + heatingTime;
            }, 0);
            
            const totalTime = dyeingTime + washingTime + (process.washSteps + 1) * settings.waterInOutTime;

            const electricityConsumption = (process.machinePower * totalTime) / 60;

            const steamConsumption = totalThermalEnergy * 3600 / (settings.steamLatentHeat * settings.boilerEfficiency);
            
            const heatSourceData = {
                coal: { heatValue: 29307, emissionFactor: 2.86 },
                heavyOil: { heatValue: 40194, emissionFactor: 3.15 },
                naturalGas: { heatValue: 38931, emissionFactor: 2.03 }
            };

            const { heatValue, emissionFactor } = heatSourceData[process.heatSource];
            const fuelConsumption = (steamConsumption * settings.steamLatentHeat) / (heatValue * settings.boilerEfficiency);
            const heatSourceCarbonEmissions = fuelConsumption * emissionFactor;

            const electricityCarbonEmissions = electricityConsumption * settings.electricityEmissionFactor;

            const totalCarbonEmissions = heatSourceCarbonEmissions + electricityCarbonEmissions;

            const perKgFabric = (value) => value / process.fabricWeight;

            const generateChartData = (process, settings) => {
                let datasets = [];
                let arrows = [];
                let totalTime = settings.waterInOutTime;

                process.dyeingStages.forEach((stage, index) => {
                    const initialTemp = (process.dyeingMode === 'twoStageTwoBaths' && index === 1) ? process.initialTemp : 
                                        (index === 0 ? process.initialTemp : process.dyeingStages[index - 1].temp);
                    
                    let tempChangeTime = 0;
                    if (stage.temp > initialTemp) {
                        tempChangeTime = (stage.temp - initialTemp) / stage.heatingRate;
                    } else if (stage.temp < initialTemp) {
                        if (index > 0 && process.dyeingMode !== 'oneStage') {
                            tempChangeTime = (initialTemp - stage.temp) / stage.coolingRate;
                        } else {
                            tempChangeTime = (initialTemp - stage.temp) / stage.heatingRate;
                        }
                    }

                    const startTime = totalTime;
                    totalTime += tempChangeTime;
                    const holdStartTime = totalTime;
                    totalTime += stage.time;

                    datasets.push({
                        label: '',
                        data: [
                            { x: startTime, y: initialTemp },
                            { x: holdStartTime, y: stage.temp },
                            { x: totalTime, y: stage.temp }
                        ],
                        borderColor: 'rgba(90, 90, 140, 0.8)',
                        tension: 0,
                        fill: false
                    });

                    if (index === process.dyeingStages.length - 1 || 
                        (process.dyeingMode === 'twoStageTwoBaths' && index === 0)) {
                        arrows.push({ 
                            x: totalTime, 
                            y: stage.temp, 
                            label: '',
                            duration: stage.time,
                            holdStartTime: holdStartTime,
                            holdEndTime: totalTime
                        });
                    }

                    if (process.dyeingMode === 'twoStageTwoBaths' && index === 0) {
                        totalTime += settings.waterInOutTime;
                    }
                });

                process.washTemps.forEach((temp, i) => {
                    const washRiseTime = (temp - process.initialTemp) / process.washHeatingRate;
                    const startTime = totalTime + settings.waterInOutTime;

                    datasets.push({
                        label: `${process.washTypes[i]}`,
                        data: [
                            { x: startTime, y: process.initialTemp },
                            { x: startTime + washRiseTime, y: temp },
                            { x: startTime + washRiseTime + process.washTimes[i], y: temp }
                        ],
                        borderColor: 'rgba(90, 90, 140, 0.8)',
                        tension: 0,
                        fill: false
                    });

                    totalTime = startTime + washRiseTime + process.washTimes[i];
                    arrows.push({ 
                        x: totalTime, 
                        y: temp, 
                        label: `${process.washTypes[i]}`, 
                        duration: process.washTimes[i],
                        holdStartTime: startTime + washRiseTime,
                        holdEndTime: totalTime
                    });
                });

                totalTime += settings.waterInOutTime;

                return { datasets, arrows, totalTime };
            };

            const chartData = generateChartData(process, settings);

            return {
                name: process.name,
                fabricWeight: process.fabricWeight,
                totalWaterAmount,
                waterConsumptionPerKg: perKgFabric(totalWaterAmount),
                totalThermalEnergy,
                thermalEnergyPerKg: perKgFabric(totalThermalEnergy),
                electricityConsumption,
                electricityConsumptionPerKg: perKgFabric(electricityConsumption),
                steamConsumption,
                steamConsumptionPerKg: perKgFabric(steamConsumption),
                totalCarbonEmissions,
                carbonEmissionsPerKg: perKgFabric(totalCarbonEmissions),
                totalTime,
                chartData
            };
        };

        const ResultDisplay = ({ result, showLabels, showTemperatureLabels, showDurationLabels, lineColor, textColor, isSingleResult }) => {
            const { language } = useLanguage();
            const text = translations[language];

            useEffect(() => {
                const ctx = document.getElementById(`chart-${result.name}`).getContext('2d');
                const maxTime = Math.ceil(result.totalTime / 10) * 10 + 10;
                
                const isMobile = window.innerWidth <= 768;

                Chart.defaults.animation = false;

                const chart = new Chart(ctx, {
                    type: 'line',
                    data: { 
                        datasets: result.chartData.datasets.map(dataset => ({
                            ...dataset,
                            borderColor: lineColor,
                            animation: false
                        }))
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'linear',
                                position: 'bottom',
                                title: { 
                                    display: !isMobile,
                                    text: text.time + ` (${text.min})`,
                                    font: { size: 14, weight: '600' }
                                },
                                max: maxTime,
                                ticks: { font: { size: isMobile ? 10 : 12 } }
                            },
                            y: {
                                title: { 
                                    display: !isMobile,
                                    text: text.temp + ' (°C)',
                                    font: { size: 14, weight: '600' }
                                },
                                min: 20,
                                max: 140,
                                ticks: { font: { size: isMobile ? 10 : 12 } }
                            }
                        },
                        plugins: { 
                            legend: { display: false },
                            tooltip: { enabled: false }
                        },
                        elements: {
                            point: { radius: 0 },
                            line: {
                                borderColor: lineColor,
                                borderWidth: isMobile ? 2 : 3
                            }
                        }
                    },
                    plugins: [{
                        afterDraw: chart => {
                            const ctx = chart.ctx;
                            const yAxis = chart.scales.y;
                            const xAxis = chart.scales.x;
                            
                            result.chartData.datasets.forEach(dataset => {
                                const data = dataset.data;
                                for (let i = 0; i < data.length - 1; i++) {
                                    const startPoint = data[i];
                                    const endPoint = data[i + 1];
                                    
                                    const endX = xAxis.getPixelForValue(endPoint.x);
                                    const endY = yAxis.getPixelForValue(endPoint.y);
                                    
                                    ctx.beginPath();
                                    ctx.arc(endX, endY, isMobile ? 2 : 3, 0, 2 * Math.PI);
                                    ctx.fillStyle = lineColor;
                                    ctx.fill();
                                    
                                    if (showTemperatureLabels && endPoint.y !== startPoint.y) {
                                        ctx.save();
                                        ctx.fillStyle = textColor;
                                        ctx.font = isMobile ? 'bold 10px Arial' : 'bold 12px Arial';
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'bottom';
                                        ctx.fillText(`${endPoint.y}°C`, endX, endY - (isMobile ? 5 : 8));
                                        ctx.restore();
                                    }
                                }
                            });
                            
                            result.chartData.arrows.forEach(arrow => {
                                const xPixel = xAxis.getPixelForValue(arrow.x);
                                const yPixel = yAxis.getPixelForValue(arrow.y);
                                
                                ctx.save();
                                ctx.strokeStyle = lineColor;
                                ctx.fillStyle = textColor;
                                ctx.lineWidth = isMobile ? 2 : 3;
                                
                                const arrowLength = isMobile ? 18 : 25;
                                const arrowWidth = isMobile ? 8 : 12;
                                ctx.beginPath();
                                ctx.moveTo(xPixel, yPixel);
                                ctx.lineTo(xPixel, yPixel + arrowLength);
                                ctx.moveTo(xPixel - arrowWidth / 2, yPixel + arrowLength - arrowWidth);
                                ctx.lineTo(xPixel, yPixel + arrowLength);
                                ctx.lineTo(xPixel + arrowWidth / 2, yPixel + arrowLength - arrowWidth);
                                ctx.stroke();
                                
                                if (showLabels && arrow.label) {
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'bottom';
                                    ctx.font = isMobile ? 'bold 11px Arial' : 'bold 13px Arial';
                                    ctx.fillText(text[arrow.label] || arrow.label, xPixel, yPixel - (isMobile ? 12 : 18));
                                }

                                if (showDurationLabels && arrow.duration) {
                                    const holdStartPixel = xAxis.getPixelForValue(arrow.holdStartTime);
                                    const holdEndPixel = xAxis.getPixelForValue(arrow.holdEndTime);
                                    const labelX = (holdStartPixel + holdEndPixel) / 2;
                                    const labelY = yPixel + (isMobile ? 3 : 5);

                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'top';
                                    ctx.font = isMobile ? '10px Arial' : '12px Arial';
                                    ctx.fillText(`${arrow.duration}`, labelX, labelY);
                                }
                                
                                ctx.restore();
                            });
                        }
                    }]
                });

                return () => {
                    Chart.defaults.animation = true;
                    chart.destroy();
                };
            }, [result, language, showLabels, showTemperatureLabels, showDurationLabels, lineColor, textColor]);

            const formatNumber = (num) => {
                return new Intl.NumberFormat().format(parseFloat(num.toFixed(2)));
            };

            return (
                <div className={`result ${isSingleResult ? 'full-width' : ''}`}>
                    <h3>{result.name}</h3>
                    <div className="chart-container" style={{height: '400px', marginBottom: '20px'}}>
                        <canvas id={`chart-${result.name}`}></canvas>
                    </div>
                    
                    <table className="result-data-table">
                        <thead>
                            <tr>
                                <th></th>
                                <th style={{textAlign: 'center'}}>{text.totalConsumption}</th>
                                <th style={{textAlign: 'center'}}>{text.unitFabricConsumption}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>{text.totalWater}:</td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.totalWaterAmount)}</span>
                                    <span className="result-data-unit">L</span>
                                </td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.waterConsumptionPerKg)}</span>
                                    <span className="result-data-unit">L/kg</span>
                                </td>
                            </tr>
                            <tr>
                                <td>{text.totalEnergy}:</td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.totalThermalEnergy)}</span>
                                    <span className="result-data-unit">kWh</span>
                                </td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.thermalEnergyPerKg)}</span>
                                    <span className="result-data-unit">kWh/kg</span>
                                </td>
                            </tr>
                            <tr>
                                <td>{text.electricity}:</td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.electricityConsumption)}</span>
                                    <span className="result-data-unit">kWh</span>
                                </td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.electricityConsumptionPerKg)}</span>
                                    <span className="result-data-unit">kWh/kg</span>
                                </td>
                            </tr>
                            <tr>
                                <td>{text.steam}:</td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.steamConsumption)}</span>
                                    <span className="result-data-unit">kg</span>
                                </td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.steamConsumptionPerKg)}</span>
                                    <span className="result-data-unit">kg/kg</span>
                                </td>
                            </tr>
                            <tr>
                                <td>{text.totalCO2}:</td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.totalCarbonEmissions)}</span>
                                    <span className="result-data-unit">kg</span>
                                </td>
                                <td style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.carbonEmissionsPerKg)}</span>
                                    <span className="result-data-unit">kg/kg</span>
                                </td>
                            </tr>
                            <tr>
                                <td>{text.totalTime}:</td>
                                <td colSpan="2" style={{textAlign: 'center'}}>
                                    <span className="result-data-value">{formatNumber(result.totalTime)}</span>
                                    <span className="result-data-unit">{text.min}</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            );
        };

        const generateChartColors = (index) => {
            const colors = [
                'rgba(196, 56, 79, 0.8)',
                'rgba(52, 152, 219, 0.8)',
                'rgba(46, 204, 113, 0.8)',
                'rgba(155, 89, 182, 0.8)',
                'rgba(241, 196, 15, 0.8)',
                'rgba(230, 126, 34, 0.8)',
                'rgba(149, 165, 166, 0.8)',
                'rgba(231, 76, 60, 0.8)',
            ];
            return colors[index % colors.length];
        };

        const ChartComponent = ({ results }) => {
            const { language } = useLanguage();
            const text = translations[language];

            useEffect(() => {
                if (results.length === 0) return;

                const baseResult = results[0];

                const createChart = (canvasId, data, labels, title) => {
                    const ctx = document.getElementById(canvasId).getContext('2d');
                    
                    const calculatePercentageChange = (value, baseValue) => {
                        return ((value - baseValue) / baseValue * 100).toFixed(2);
                    };

                    const maxValue = Math.max(...data.datasets.flatMap(dataset => dataset.data));
                    const yAxisMax = maxValue * 1.2;

                    const chart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: data.datasets
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: yAxisMax,
                                    title: {
                                        display: true,
                                        text: title,
                                        font: { size: 14, weight: '600' }
                                    },
                                    ticks: { font: { size: 12 } }
                                },
                                x: {
                                    ticks: { font: { size: 12 } }
                                }
                            },
                            plugins: {
                                legend: {
                                    labels: { font: { size: 12 } }
                                },
                                tooltip: {
                                    titleFont: { size: 14 },
                                    bodyFont: { size: 12 },
                                    callbacks: {
                                        label: (context) => {
                                            let label = context.dataset.label || '';
                                            if (label) {
                                                label += ': ';
                                            }
                                            if (context.parsed.y !== null) {
                                                label += context.parsed.y.toFixed(2);
                                            }
                                            if (context.datasetIndex !== 0) {
                                                const baseValue = baseResult[data.dataKeys[context.dataIndex]];
                                                const percentChange = calculatePercentageChange(context.parsed.y, baseValue);
                                                label += ` (${percentChange > 0 ? '+' : ''}${percentChange}%)`;
                                            }
                                            return label;
                                        }
                                    }
                                }
                            }
                        },
                        plugins: [{
                            afterDraw: (chart) => {
                                const ctx = chart.ctx;
                                chart.data.datasets.forEach((dataset, i) => {
                                    const meta = chart.getDatasetMeta(i);
                                    meta.data.forEach((bar, index) => {
                                        const data = dataset.data[index];
                                        
                                        ctx.fillStyle = '#ffffff';
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'bottom';
                                        ctx.font = 'bold 13px Arial';
                                        
                                        const barY = bar.y + (chart.scales.y.getPixelForValue(0) - bar.y) * 0.85;
                                        ctx.fillText(data.toFixed(2), bar.x, barY);
                                        
                                        if (i > 0) {
                                            const baseValue = chart.data.datasets[0].data[index];
                                            const percentChange = calculatePercentageChange(data, baseValue);
                                            const text = `${percentChange > 0 ? '+' : ''}${percentChange}%`;
                                            
                                            ctx.fillStyle = '#2c3e50';
                                            ctx.textAlign = 'center';
                                            ctx.textBaseline = 'bottom';
                                            ctx.font = 'bold 11px Arial';
                                            ctx.fillText(text, bar.x, bar.y - 10);
                                        }
                                    });
                                });
                            }
                        }]
                    });

                    return chart;
                };

                const waterData = {
                    datasets: results.map((result, index) => ({
                        label: result.name,
                        data: [result.waterConsumptionPerKg],
                        backgroundColor: generateChartColors(index),
                    })),
                    dataKeys: ['waterConsumptionPerKg']
                };

                const energyData = {
                    datasets: results.map((result, index) => ({
                        label: result.name,
                        data: [result.thermalEnergyPerKg, result.electricityConsumptionPerKg, result.carbonEmissionsPerKg],
                        backgroundColor: generateChartColors(index),
                    })),
                    dataKeys: ['thermalEnergyPerKg', 'electricityConsumptionPerKg', 'carbonEmissionsPerKg']
                };

                const waterChart = createChart('waterChart', waterData, [`${text.totalWater} (L/kg·fabric)`]);
                const energyChart = createChart('energyChart', energyData, [`${text.totalEnergy} (kWh/kg·fabric)`, `${text.electricity} (kWh/kg·fabric)`, `${text.totalCO2} (kg/kg·fabric)`]);

                return () => {
                    waterChart.destroy();
                    energyChart.destroy();
                };
            }, [results, language]);

            return (
                <div className="charts-container">
                    <div className="chart-wrapper">
                        <div className="chart-title">
                            <h3>{text.waterUsageComparison}</h3>
                            <div className="chart-subtitle">(per kg fabric)</div>
                        </div>
                        <div className="chart-canvas-container">
                            <canvas id="waterChart"></canvas>
                        </div>
                    </div>
                    <div className="chart-wrapper">
                        <div className="chart-title">
                            <h3>{text.energyCO2Comparison}</h3>
                            <div className="chart-subtitle">(per kg fabric)</div>
                        </div>
                        <div className="chart-canvas-container">
                            <canvas id="energyChart"></canvas>
                        </div>
                    </div>
                </div>
            );
        };

        const CalculationMethods = ({ isExpanded }) => {
            const { language } = useLanguage();
            const text = translations[language];

            if (!isExpanded) return null;

            return (
                <div className="calculation-methods">
                    <h3 style={{color: '#C4384F', marginTop: 0}}>{text.calculationMethods}</h3>
                    <div style={{lineHeight: '1.8', color: '#34495e'}}>
                        <p><strong>1. {text.totalWater}:</strong></p>
                        <p style={{marginLeft: '20px'}}>• 染色用水量 = 布料重量 × 浴比</p>
                        <p style={{marginLeft: '20px'}}>• 殘留水量 = 布料重量 × 殘留水量係數</p>
                        <p style={{marginLeft: '20px'}}>• 每次補充水量 = 染色用水量 - 殘留水量</p>
                        <p style={{marginLeft: '20px'}}>• 總用水量 = 染色用水量 + (補充水量 × 水洗次數)</p>
                        
                        <p><strong>2. {text.totalEnergy}:</strong></p>
                        <p style={{marginLeft: '20px'}}>• 升溫能耗 = 水量 × 水的比熱容 × (目標溫度 - 初始溫度)</p>
                        <p style={{marginLeft: '20px'}}>• 維持能耗 = 水量 × 水的比熱容 × 溫度維持能耗係數 × 維持時間</p>
                        <p style={{marginLeft: '20px'}}>• 總熱能消耗 = (染色段熱能 + 水洗段熱能) / (1 - 熱能損失因子)</p>
                        
                        <p><strong>3. {text.electricity}:</strong></p>
                        <p style={{marginLeft: '20px'}}>• 電力消耗 = 染機功率 × 總時間 / 60 (kWh)</p>
                        
                        <p><strong>4. {text.steam}:</strong></p>
                        <p style={{marginLeft: '20px'}}>• 蒸汽消耗 = 總熱能消耗 × 3600 / (蒸汽潛熱 × 鍋爐效率)</p>
                        
                        <p><strong>5. {text.totalCO2}:</strong></p>
                        <p style={{marginLeft: '20px'}}>• 熱源碳排放 = 燃料消耗 × 燃料排放因子</p>
                        <p style={{marginLeft: '20px'}}>• 電力碳排放 = 電力消耗 × 電力排放因子</p>
                        <p style={{marginLeft: '20px'}}>• 總碳排放 = 熱源碳排放 + 電力碳排放</p>
                    </div>
                </div>
            );
        };

        const SavedProcessList = ({ onLoad, onDelete }) => {
            const [savedProcesses, setSavedProcesses] = useState([]);
            const { language } = useLanguage();
            const text = translations[language];

            useEffect(() => {
                const processes = JSON.parse(localStorage.getItem('dyeingProcesses') || '[]');
                setSavedProcesses(processes);
            }, []);

            const handleDelete = (index) => {
                const newProcesses = savedProcesses.filter((_, i) => i !== index);
                localStorage.setItem('dyeingProcesses', JSON.stringify(newProcesses));
                setSavedProcesses(newProcesses);
                onDelete();
            };

            return (
                <div className="saved-process-list">
                    <h3 style={{color: '#C4384F', marginTop: 0}}>{text.saved}</h3>
                    {savedProcesses.map((process, index) => (
                        <div key={index} className="saved-process-item">
                            <span style={{fontWeight: '600', color: '#2c3e50'}}>{process.name}</span>
                            <div>
                                <button className="load-process" onClick={() => onLoad(process)}>{text.load}</button>
                                <button className="delete-process" onClick={() => handleDelete(index)}>{text.delete}</button>
                            </div>
                        </div>
                    ))}
                    {savedProcesses.length > 0 && (
                        <button className="delete-process" style={{width: '100%', marginTop: '10px'}} onClick={() => {
                            localStorage.removeItem('dyeingProcesses');
                            setSavedProcesses([]);
                            onDelete();
                        }}>{text.clearAllSaved}</button>
                    )}
                </div>
            );
        };

        const VisualizationControls = ({ 
            showLabels, setShowLabels, 
            showTemperatureLabels, setShowTemperatureLabels, 
            showDurationLabels, setShowDurationLabels,
            lineColor, setLineColor,
            textColor, setTextColor
        }) => {
            const { language } = useLanguage();
            const text = translations[language];
            
            return (
                <div className="visualization-controls">
                    <h4 style={{color: '#2c3e50', marginTop: 0, marginBottom: '15px'}}>{text.visualControls}</h4>
                    <div className="control-row">
                        <button className="unified-button" onClick={() => setShowLabels(!showLabels)}>
                            {showLabels ? text.hideLabels : text.showLabels}
                        </button>
                        <button className="unified-button" onClick={() => setShowTemperatureLabels(!showTemperatureLabels)}>
                            {showTemperatureLabels ? text.hideTemperatureLabels : text.showTemperatureLabels}
                        </button>
                        <button className="unified-button" onClick={() => setShowDurationLabels(!showDurationLabels)}>
                            {showDurationLabels ? text.hideDurationLabels : text.showDurationLabels}
                        </button>
                        <div className="control-item">
                            <span style={{fontWeight: '600'}}>{text.lineColor}:</span>
                            <input
                                type="color"
                                value={lineColor}
                                onChange={(e) => setLineColor(e.target.value)}
                                style={{ width: '40px', height: '40px', cursor: 'pointer', borderRadius: '8px' }}
                            />
                        </div>
                        <div className="control-item">
                            <span style={{fontWeight: '600'}}>{text.textColor}:</span>
                            <input
                                type="color"
                                value={textColor}
                                onChange={(e) => setTextColor(e.target.value)}
                                style={{ width: '40px', height: '40px', cursor: 'pointer', borderRadius: '8px' }}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const EnergyConsumptionCalculator = () => {
            const [processes, setProcesses] = useState([]);
            const [results, setResults] = useState([]);
            const [settings, setSettings] = useState({
                waterHeatCapacity: 4.186,
                boilerEfficiency: 0.8,
                steamLatentHeat: 2257,
                electricityEmissionFactor: 0.5,
                waterInOutTime: 5,
                temperatureMaintainFactor: 0.005,
                heatLossFactor: 0.1,
                residualWaterFactor: 2
            });
            const [showCalculationMethods, setShowCalculationMethods] = useState(false);
            const [showSavedProcesses, setShowSavedProcesses] = useState(false);
            const [showLabels, setShowLabels] = useState(true);
            const [showTemperatureLabels, setShowTemperatureLabels] = useState(true);
            const [showDurationLabels, setShowDurationLabels] = useState(true);
            const [lineColor, setLineColor] = useState('#C4384F');
            const [textColor, setTextColor] = useState('#2c3e50');

            const { language, setLanguage } = useLanguage();
            const text = translations[language];

            const handleAddProcess = () => {
                setProcesses([...processes, {
                    name: `${text.processName} ${processes.length + 1}`,
                    fabricWeight: 100,
                    bathRatio: 10,
                    initialTemp: 30,
                    machinePower: 12,
                    heatSource: 'heavyOil',
                    dyeingMode: 'oneStage',
                    dyeingStages: [{ temp: 60, time: 60, heatingRate: 2, coolingRate: 1 }],
                    washSteps: 3,
                    washTemps: [60, 60, 60],
                    washTimes: [10, 10, 10],
                    washTypes: ['rinse', 'rinse', 'rinse'],
                    washHeatingRate: 2
                }]);
            };

            const handleUpdateProcess = (index, updatedProcess) => {
                const newProcesses = [...processes];
                newProcesses[index] = updatedProcess;
                setProcesses(newProcesses);
            };

            const handleDeleteProcess = (index) => {
                const newProcesses = processes.filter((_, i) => i !== index);
                setProcesses(newProcesses);
            };

            const handleSaveProcess = (process) => {
                const savedProcesses = JSON.parse(localStorage.getItem('dyeingProcesses') || '[]');
                const processWithId = { ...process, id: Date.now() };
                savedProcesses.push(processWithId);
                localStorage.setItem('dyeingProcesses', JSON.stringify(savedProcesses));
                alert(text.saved);
                setShowSavedProcesses(true);
            };

            const handleLoadSingleProcess = (process) => {
                const updatedProcess = {
                    ...process,
                    washHeatingRate: process.washHeatingRate || 2,
                };
                
                if (updatedProcess.dyeingStages) {
                    updatedProcess.dyeingStages = updatedProcess.dyeingStages.map(stage => ({
                        ...stage,
                        heatingRate: stage.heatingRate || 2,
                        coolingRate: stage.coolingRate || 1
                    }));
                }
                
                setProcesses([...processes, updatedProcess]);
                setShowSavedProcesses(false);
            };

            const handleCalculate = () => {
                const newResults = processes.map(process => calculateEmissions(process, settings));
                setResults(newResults);
            };

            useEffect(() => {
                if (processes.length === 0) {
                    handleAddProcess();
                }
            }, []);

            return (
                <div className="container">
                    <div className="language-selector">
                        <select value={language} onChange={(e) => setLanguage(e.target.value)}>
                            <option value="en">English</option>
                            <option value="zh">中文</option>
                        </select>
                    </div>
                    <h1>{text.title}</h1>
                    <CustomSettings settings={settings} onUpdateSettings={setSettings} />
                    {processes.map((process, index) => (
                        <ProcessForm
                            key={process.id || index}
                            process={process}
                            onUpdate={(updatedProcess) => handleUpdateProcess(index, updatedProcess)}
                            onDelete={() => handleDeleteProcess(index)}
                            onSave={handleSaveProcess}
                        />
                    ))}
                    <button className="add-process" onClick={handleAddProcess}>
                        {text.addProcess}
                    </button>
                    <div className="button-group-container">
                        <div className="button-group">
                            <button className="calculate" onClick={handleCalculate}>
                                {text.calculate}
                            </button>
                            <button className="toggle-methods" onClick={() => setShowCalculationMethods(!showCalculationMethods)}>
                                {showCalculationMethods ? text.hideMethods : text.showMethods}
                            </button>
                            <button className="load-process" onClick={() => setShowSavedProcesses(!showSavedProcesses)}>
                                {showSavedProcesses ? text.hideSavedProcesses : text.showSavedProcesses}
                            </button>
                        </div>
                    </div>

                    {results.length > 0 && (
                        <VisualizationControls
                            showLabels={showLabels}
                            setShowLabels={setShowLabels}
                            showTemperatureLabels={showTemperatureLabels}
                            setShowTemperatureLabels={setShowTemperatureLabels}
                            showDurationLabels={showDurationLabels}
                            setShowDurationLabels={setShowDurationLabels}
                            lineColor={lineColor}
                            setLineColor={setLineColor}
                            textColor={textColor}
                            setTextColor={setTextColor}
                        />
                    )}

                    {showCalculationMethods && <CalculationMethods isExpanded={showCalculationMethods} />}
                    
                    {showSavedProcesses && (
                        <SavedProcessList
                            onLoad={handleLoadSingleProcess}
                            onDelete={() => setShowSavedProcesses(true)}
                        />
                    )}
                    
                    <div className="results-container">
                        {results.map((result, index) => (
                            <ResultDisplay 
                                key={index} 
                                result={result} 
                                showLabels={showLabels} 
                                showTemperatureLabels={showTemperatureLabels}
                                showDurationLabels={showDurationLabels}
                                lineColor={lineColor}
                                textColor={textColor}
                                isSingleResult={results.length === 1}
                            />
                        ))}
                    </div>
                    
                    {results.length > 0 && <ChartComponent results={results} />}
                </div>
            );
        };

        const App = () => (
            <LanguageProvider>
                <EnergyConsumptionCalculator />
            </LanguageProvider>
        );

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
